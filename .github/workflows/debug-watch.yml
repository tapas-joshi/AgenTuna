# TEMPORARY diagnostic (remove after the macOS arm64 watcher investigation): loops the
# self-write suppression test on the Apple Silicon runner and prints every delivered event.
name: debug-watch
on:
  pull_request:
    paths: [".github/workflows/debug-watch.yml"]
permissions:
  contents: read
jobs:
  loop:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: Loop the test with CPU load
        run: |
          cargo test -p at-engine --test drift_watch --no-run
          for i in 1 2 3 4; do (yes >/dev/null &) ; done
          fails=0
          for i in $(seq 1 25); do
            if ! cargo test -p at-engine --test drift_watch an_agentuna_write -- --nocapture --test-threads=1 >/tmp/run.log 2>&1; then
              fails=$((fails+1)); echo "=== failure on iteration $i"; grep -E "panicked|must not reach|all events" /tmp/run.log | head -6
            fi
          done
          echo "failures: $fails of 25"
          [ "$fails" -eq 0 ]
