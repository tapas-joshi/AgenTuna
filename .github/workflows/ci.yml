name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: macos-15
    # Apple Silicon image (the platform the app ships for). Timings below were measured on the Intel
    # image: a cold cache spent ~18 min in tests, ~9 in clippy and over 14 in the
    # release build with the embedded frontend, so 45 minutes cancelled the job mid-build. 70
    # leaves headroom for the whole sequence without hiding a genuine hang.
    timeout-minutes: 70
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the UI the Tauri app embeds
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: |
          mkdir -p target/ci-logs
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee target/ci-logs/test.log

      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build the release app with the embedded frontend
        run: cargo build --release -p at-app --features custom-protocol

      - name: Generated TypeScript types are committed
        run: git diff --exit-code -- ui/src/generated

      - name: Upload test logs and golden diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-failure-logs
          path: |
            target/ci-logs/
            target/golden-diffs/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Run UI tests
        run: pnpm --dir ui test

      - name: Build the UI
        run: pnpm --dir ui build

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo registry and installed binaries
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cargo-deny-${{ hashFiles('deny.toml') }}

      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

  portability:
    name: portability
    # TF-037/TF-039: compile the path modules natively on Linux. The Windows build is proved by
    # the `windows` job on a Windows runner; a cross-check from Linux only proved the target was
    # installable, so it lives there now.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-portability
          cache-on-failure: true

      - name: Check the path modules on Linux
        run: cargo check -p at-store

  golden:
    name: golden files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-golden
          cache-on-failure: true

      - name: Verify golden files offline
        run: scripts/golden.sh --check

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-diffs
          path: target/golden-diff/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual (${{ matrix.shard }}/3)
    # TU-025. Informational: the required checks stay `rust`, `frontend` and `supply-chain`.
    # The goldens were captured with Chromium on Apple Silicon macOS and macOS/Linux font
    # rasterisation differs by more than the 0.1% pixel budget, so this runs on the same macOS
    # image as `rust` (Apple Silicon, like the machine that produced the goldens).
    #
    # Three shards keep each one inside the story's 180-second budget: the whole suite took 479 s
    # on this image, so one job could never fit. `fail-fast: false` keeps every shard's failures
    # visible instead of cancelling the others.
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install the Chromium build the project pins
        run: pnpm --dir ui exec playwright install chromium

      - name: Build the production bundle the suite serves
        run: pnpm --dir ui build

      - name: Compare against the goldens
        # Headless by default, so no window server is involved. The suite is the whole step, and
        # its wall clock is checked against the story's 180-second budget after it finishes (the
        # bundle was built in the step above, so the budget covers only the comparison). The
        # budget applies per shard: three shards of the same suite, each under 180 s.
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
        run: |
          mkdir -p target/ci-logs
          started="$(date +%s)"
          set +e
          # `pnpm exec` forwards the flag verbatim; `pnpm run visual -- --shard=…` swallowed it
          # (pnpm 12 passed an extra `--`, so Playwright read the shard as a file filter).
          pnpm --dir ui exec playwright test --shard="${{ matrix.shard }}/3" 2>&1 | tee "target/ci-logs/visual-${{ matrix.shard }}.log"
          status="${PIPESTATUS[0]}"
          elapsed="$(( $(date +%s) - started ))"
          echo "Visual suite wall clock (shard ${{ matrix.shard }}/3): ${elapsed}s (story budget: 180s)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::the visual suite failed on shard ${{ matrix.shard }}/3; compare ui/test-results with the goldens"
            exit "$status"
          fi
          if [ "$elapsed" -gt 180 ]; then
            echo "::error::visual shard ${{ matrix.shard }}/3 took ${elapsed}s, over the 180s budget"
            exit 1
          fi

      - name: Goldens only change with UPDATE_SNAPSHOTS=1
        run: |
          changed="$(git status --porcelain -- ui/e2e/snapshots)"
          if [ -n "$changed" ]; then
            echo "::error::a run without UPDATE_SNAPSHOTS=1 must not write ui/e2e/snapshots; regenerate deliberately with UPDATE_SNAPSHOTS=1 cargo test -p at-app --test snapshots"
            echo "$changed"
            exit 1
          fi

      - name: Upload screenshot diffs and the HTML report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-failure-artifacts-${{ matrix.shard }}
          path: |
            ui/test-results/
            ui/playwright-report/
            target/ci-logs/visual-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 7

  ubuntu:
    name: ubuntu
    # Informational while the Linux target is being established; macOS remains the required Rust job.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-ubuntu
          cache-on-failure: true

      - name: Check workspace on Linux
        run: cargo check --workspace --all-targets

      - name: Test workspace libraries and CLI on Linux
        run: cargo test --workspace --exclude at-app

      - name: Test app command layer on Linux
        run: cargo test -p at-app --lib

  windows:
    name: windows
    # TF-038 slice 1: the workspace compiles for x86_64-pc-windows-msvc. Informational while the
    # Windows port is being built out (the remaining slices enable the test suite, the updater and
    # an NSIS installer); the required checks stay `rust`, `frontend` and `supply-chain`.
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # `tauri.conf.json` embeds `ui/dist`, and the build script refuses to run without it, so the
      # same frontend the macOS job builds is built here before any Rust compilation.
      - name: Build the UI the Tauri app embeds
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-windows
          cache-on-failure: true

      - name: Check the workspace for x86_64-pc-windows-msvc
        run: cargo check --workspace --all-targets
