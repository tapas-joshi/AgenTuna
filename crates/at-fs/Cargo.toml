[package]
name = "at-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Shared test fixtures (`at_fs::testkit`). Never enabled by production crates.
testkit = ["dep:env-lock", "dep:tempfile"]
# Test-only fault injection (`at_fs::failpoint`). Never enabled by production crates;
# compiled out of release builds entirely.
faults = []

[dependencies]
at-model.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
similar.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["macros"] }
sha2.workspace = true
libc.workspace = true
fs4.workspace = true
at-db.workspace = true
rusqlite.workspace = true
rustix = { workspace = true, features = ["process"] }
env-lock = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Dev-only cycle: at-store depends on at-fs, so this is the only direction a fixture can see
# `AppPaths` from. `at_fs::testkit` itself never names at-store.
at-store.workspace = true
# Self dev-dependency so integration tests see `at_fs::failpoint` (same pattern as at-migrate).
at-fs = { path = ".", features = ["faults"] }

[target.'cfg(windows)'.dependencies]
junction.workspace = true
