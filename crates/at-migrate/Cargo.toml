[package]
name = "at-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Fixtures and the round-trip harness (`at_migrate::testkit`). Never enabled by production
# crates: it builds real agent folders inside a temporary home.
testkit = ["at-fs/testkit"]

[dependencies]
at-db.workspace = true
at-model.workspace = true
at-adapters.workspace = true
at-fs.workspace = true
at-store.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonc-parser = { workspace = true, features = ["cst", "serde_json"] }
sha2.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
time.workspace = true
toml_edit.workspace = true
similar.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
 

[dev-dependencies]
# Dev-only cycle: the crate under test needs its own `testkit` feature during `cargo test`.
at-migrate = { path = ".", features = ["testkit"] }
at-fs = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
