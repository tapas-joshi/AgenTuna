[package]
name = "at-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Builds the JSON-RPC stdio fake server used by the session acceptance tests.
# It is never part of a shipped AgenTuna binary.
testkit = ["dep:signal-hook"]

[[bin]]
name = "at-mcp-fake-server"
path = "tests/support/fake_mcp_server.rs"
required-features = ["testkit"]

[dependencies]
async-trait.workspace = true
at-model.workspace = true
at-secrets.workspace = true
http.workspace = true
oauth2.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
signal-hook = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
webbrowser.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
