[package]
name = "at-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "at_app"

[[bin]]
name = "agentuna-app"
path = "src/main.rs"

[[bin]]
name = "at-app-health-fixture"
path = "tests/support/health_fixture_server.rs"
required-features = ["testkit"]

[lints]
workspace = true

[features]
# Builds the TM-030 health fixture server used by the scheduler process tests.
# It is never part of a shipped AgenTuna binary.
testkit = []
# Embeds `build.frontendDist` into the binary instead of loading `build.devUrl`.
# `tauri build` enables `tauri/custom-protocol` itself through this feature; a direct
# `cargo build` (scripts/bundle.sh) must pass `--features custom-protocol` or the
# release app would load http://localhost:1420 and only work beside a dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
at-mcp.workspace = true
at-migrate.workspace = true
at-model.workspace = true
at-fs.workspace = true
at-store.workspace = true
at-engine.workspace = true
at-db.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
ts-rs.workspace = true
ed25519-dalek.workspace = true
url.workspace = true
reqwest.workspace = true
sha2.workspace = true
time.workspace = true
at-git.workspace = true
at-adapters.workspace = true
at-secrets.workspace = true
similar.workspace = true
tokio-util.workspace = true
zip.workspace = true
rusqlite.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# Synthesizes a platform watch refusal so TA-081's tolerant-root policy is testable.
notify.workspace = true

# TF-010's temp-HOME fixture (`at_fs::testkit::TestHome`). Test builds only.
at-fs = { workspace = true, features = ["testkit"] }
at-migrate = { workspace = true, features = ["testkit"] }
# Dev-only cycle: the crate under test needs its own `testkit` feature during `cargo test`
# so `CARGO_BIN_EXE_at-app-health-fixture` exists (same pattern as at-migrate and at-fs).
at-app = { path = ".", features = ["testkit"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }
