[package]
name = "at-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentuna"
path = "src/main.rs"

[lints]
workspace = true

# TU-034: the CLI is a thin front end. Allowed first-party crates are the engine and
# the IO crates that own every write; `time` is a value type required by the at-fs
# repair API, not an IO crate. No rusqlite: the index is opened through at-db.
# `at-git` and `at-secrets` supply the runner and credential-store traits that
# `at-store::remote_backup` requires; the CLI never spawns git or reaches the Keychain
# on its own.
[dependencies]
at-model.workspace = true
at-store.workspace = true
at-engine.workspace = true
at-db.workspace = true
at-fs.workspace = true
at-migrate.workspace = true
at-adapters.workspace = true
at-git.workspace = true
at-secrets.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
at-fs = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
saphyr.workspace = true
sha2.workspace = true
